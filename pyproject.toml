[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroshot_pfn"
version = "0.1.0"
description = "Zero-Shot Tabular Machine Learning Prediction Engine using Prior-Fitted Networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zero-Shot PFN Team" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
extra = [
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "sentence-transformers>=2.2.0",
    "pynvml>=11.5.0",
]

[project.scripts]
zeroshot-train = "zeroshot_pfn.train:main"
zeroshot-predict = "predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
